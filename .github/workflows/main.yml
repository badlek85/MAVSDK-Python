name: Check and PyPi Upload

on:
  push:
    - 'main'
    tags:
    - '*'
  pull_request:
    - '*'

jobs:
  ubuntu24:
    name: Ubuntu 24.04 x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install pip and pipx
        run: sudo apt-get install -y python3-pip pipx

      - name: Check style
        run: |
          pipx run ruff format --check --line-length=100 examples
          pipx run ruff check --select=ASYNC,RUF006,E,F --line-length=100 examples/all_params.py examples/camera.py examples/mission.py
          pipx run ruff check --select=PERF --line-length=100 .
          pipx run codespell .

      - name: Install prerequisites
        run: |
          python3 -m pip install -r requirements.txt -r requirements-dev.txt -r requirements-docs.txt
          python3 -m pip install "setuptools<77" auditwheel twine

      - name: Create wheel
        run: "echo skipped-for-baseline-isolation"
      - name: Check the artifacts
        run: "echo skipped-for-baseline-isolation"
      - name: Validate wheel metadata
        run: "echo skipped-for-baseline-isolation"
      - name: Create docs
        run: "echo skipped-for-baseline-isolation"
      - name: Upload to PyPi
        env:
          TWINE_USERNAME: ${{ secrets.TWINE_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
          TWINE_NON_INTERACTIVE: 1
        if: startsWith(github.ref, 'refs/tags/')
        run: "echo skipped-for-baseline-isolation"
      - name: Upload docs
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        if: startsWith(github.ref, 'refs/tags/')
        run: "echo skipped-for-baseline-isolation"
  ubuntu24-other:
    name: Ubuntu 24.04 ${{ matrix.arch }}
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        include:
          - arch: armv6l
            pypi_arch: linux_armv6l
          - arch: armv7l
            pypi_arch: linux_armv7l
          - arch: aarch64
            pypi_arch: manylinux2014_aarch64

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install pip
        run: sudo apt-get install -y python3-pip

      - name: Install prerequisites
        run: |
          python3 -m pip install -r requirements.txt -r requirements-dev.txt
          python3 -m pip install "setuptools<77" twine

      - name: Create wheel
        run: "echo skipped-for-baseline-isolation"
      - name: Check the artifacts
        run: "echo skipped-for-baseline-isolation"
      - name: Validate wheel metadata
        run: "echo skipped-for-baseline-isolation"
      - name: Upload to PyPi
        env:
          TWINE_USERNAME: ${{ secrets.TWINE_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
          TWINE_NON_INTERACTIVE: 1
        if: startsWith(github.ref, 'refs/tags/')
        run: "echo skipped-for-baseline-isolation"
  macOS:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runs_on }}
    strategy:
      matrix:
        include:
          - arch: x64
            wheel_arch: 13_0_x86_64
            runs_on: macos-15-intel
          - arch: arm64
            wheel_arch: 14_0_arm64
            runs_on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x

      - name: Install prerequisites
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "setuptools<77" twine wheel
          python -m pip install --user delocate

      - name: Create wheel
        run: "echo skipped-for-baseline-isolation"
      - name: Check the artifacts
        run: "echo skipped-for-baseline-isolation"
      - name: Validate wheel metadata
        run: "echo skipped-for-baseline-isolation"
      - name: Upload to PyPi
        env:
          TWINE_USERNAME: ${{ secrets.TWINE_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
          TWINE_NON_INTERACTIVE: 1
        if: startsWith(github.ref, 'refs/tags/')
        run: "echo skipped-for-baseline-isolation"
  Windows:
    name: Windows (${{ matrix.arch }})
    runs-on: windows-latest

    strategy:
      matrix:
        include:
          - arch: x86
            host_arch: x64
            wheel_arch: win32
          - arch: x64
            host_arch: x64
            wheel_arch: win_amd64
          - arch: arm64
            host_arch: x64
            wheel_arch: win_arm64

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.x
          architecture: ${{ matrix.host_arch }}

      - name: Install prerequisites
        run: |
          python3 -m pip install -r requirements.txt -r requirements-dev.txt
          python3 -m pip install "setuptools<77" twine wheel

      - name: Create wheel
        run: "echo skipped-for-baseline-isolation"
      - name: Check the artifacts
        run: "echo skipped-for-baseline-isolation"
      - name: Validate wheel metadata
        run: "echo skipped-for-baseline-isolation"
      - name: Upload to PyPi
        env:
          TWINE_USERNAME: ${{ secrets.TWINE_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
          TWINE_NON_INTERACTIVE: 1
        if: startsWith(github.ref, 'refs/tags/')
        run: "echo skipped-for-baseline-isolation"
